[project]
name = "prompt-engineering-for-ke"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "chromadb>=1.5.9",
    "datasets==3.6.0",
    "instructorembedding>=1.0.1",
    "langchain>=1.4.9",
    "langchain-huggingface>=1.2.3",
    "openai>=3.46.0",
    "protobuf>=7.36.2",
    "retry>=0.9.2",
    "sentence-transformers>=6.2.0",
    "sentencepiece>=0.2.3",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.22.1",
]


[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
